name: Test Product CI Prod Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  crud-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start MongoDB Container
        run: |
          docker run -d --name mongodb-test -p 27017:27017 mongo:latest
          # Đợi MongoDB khởi động hoàn toàn
          until docker exec mongodb-test mongosh --eval "db.adminCommand('ping')" > /dev/null 2>&1; do
            echo "Waiting for MongoDB..."
            sleep 2
          done
          echo "MongoDB is ready!"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run CRUD Integration Tests
        env:
          PORT: 3000
          MONGO_URI: mongodb://127.0.0.1:27017/productdb_test
        run: npm test