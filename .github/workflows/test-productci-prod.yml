name: Test Product CI Prod Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  crud-test:
    runs-on: ubuntu-latest

    # Khởi chạy service MongoDB trên máy ảo GitHub Actions
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run CRUD Integration Tests with MongoDB
        env:
          PORT: 3000
          MONGO_URI: mongodb://localhost:27017/productdb_test
        run: npm test