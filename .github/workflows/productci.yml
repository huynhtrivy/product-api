name: Product API CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Unit/CRUD tests
        run: npm test

      # HEALTHCHECK CONTAINER TRONG BƯỚC CI
      - name: Build Docker image for CI Healthcheck
        run: docker build -t product-api:ci .

      - name: Run container & verify healthcheck
        run: |
          docker run -d --name test-api -p 3000:3000 -e PORT=3000 product-api:ci
          echo "Waiting for container to start..."
          sleep 5
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health)
          echo "Health check HTTP status: $STATUS_CODE"
          if [ "$STATUS_CODE" -ne 200 ]; then
            echo "Healthcheck failed!"
            docker logs test-api
            exit 1
          fi
          echo "Healthcheck passed successfully!"
          docker stop test-api

  # BƯỚC CD: PUSH LÊN DOCKER HUB KHI TEST & HEALTHCHECK PASS
  deploy-docker:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest